<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self';
             script-src 'self';
             style-src 'self' https://fonts.googleapis.com;
             font-src https://fonts.gstatic.com;
             img-src 'self' data:;
             connect-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickDrop Notepad</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div class="custom-titlebar">
      <div class="titlebar-drag-area">
        <div class="drag-indicator"></div>
      </div>
    </div>
    
    <div class="flip-container" id="flip-container">
      <div class="flipper">
        <!-- 表面（メインエディタ） -->
        <div class="front">
          <div class="content-wrapper">
            <main class="main-content">
              <header class="toolbar">
                <div class="toolbar-left">
                  <div class="logo">QuickDrop</div>
                </div>
                <div class="actions">
                  <!-- 設定ボタン（歯車） -->
                  <button id="settings-btn" class="icon-btn" title="Settings">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                  </button>
                  <button id="pin-btn" class="icon-btn" title="Pin to top">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                  </button>
                  <button id="undo-btn" class="icon-btn hidden" title="Undo">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"></path></svg>
                  </button>
                  <button id="clear-btn" class="btn danger-btn">Clear</button>
                  <button id="copy-btn" class="btn primary-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>
                    Copy
                  </button>
                </div>
              </header>

              <div class="editor-wrapper">
                <textarea id="editor" placeholder="ここに一時保存したいテキストを書き込んでください...（Ctrl+Shift+V で別ウィンドウの履歴を呼び出せます）"></textarea>
              </div>

              <footer class="status-bar">
                <div class="status-item">
                  <span id="char-count">0</span> chars
                </div>
                <div id="save-status" class="status-indicator">Saved</div>
              </footer>
            </main>
          </div>
        </div>

        <!-- 裏面（設定画面） -->
        <div class="back">
          <div class="content-wrapper">
            <header class="toolbar">
              <div class="toolbar-left">
                <div class="logo">Settings</div>
              </div>
              <div class="actions">
                <button id="back-btn" class="btn primary-btn">Done</button>
              </div>
            </header>
            
            <div class="settings-content">
              <div class="setting-group">
                <label class="setting-item">
                  <span class="setting-label">Run on Startup</span>
                  <div class="toggle-switch">
                    <input type="checkbox" id="setting-startup">
                    <span class="slider"></span>
                  </div>
                </label>
                <div class="setting-desc">Windows起動時にバックグラウンドで待機します。</div>
              </div>

              <div class="setting-group">
                <label class="setting-item">
                  <span class="setting-label">Main Shortcut</span>
                  <select id="setting-shortcut" class="custom-select">
                    <option value="Alt+Space">Alt + Space (推奨)</option>
                    <option value="CommandOrControl+Shift+Space">Ctrl + Shift + Space</option>
                    <option value="CommandOrControl+Alt+N">Ctrl + Alt + N</option>
                  </select>
                </label>
              </div>

              <div class="setting-group">
                <label class="setting-item">
                  <span class="setting-label">History Limit</span>
                  <select id="setting-history-limit" class="custom-select">
                    <option value="10">10 (軽量)</option>
                    <option value="50">50 (標準)</option>
                    <option value="100">100</option>
                    <option value="500">500</option>
                  </select>
                </label>
                <div class="setting-desc">保存件数を超えると古い履歴から自動削除されます。</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
